version: "3.8"
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quickgift
    ports:
      - "5432:5432"
    
          volumes:
      - quickgift_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/migration_001_otp_codes.sql:/docker-entrypoint-initdb.d/2-migration_001_otp_codes.sql
      - ./database/migration_002_shiprocket.sql:/docker-entrypoint-initdb.d/3-migration_002_shiprocket.sql
      - ./database/migration_003_warehouse_stock_approval.sql:/docker-entrypoint-initdb.d/4-migration_003_warehouse_stock_approval.sql
      - ./database/migration_005_inventory_uniqueness.sql:/docker-entrypoint-initdb.d/5-migration_005_inventory_uniqueness.sql
      - ./database/migration_006_stock_variant_delete_safety.sql:/docker-entrypoint-initdb.d/6-migration_006_stock_variant_delete_safety.sql

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: quickgift
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      PORT: 4000
      CORS_ORIGIN: "*"
    ports:
      - "4000:4000"

volumes:
  quickgift_pgdata:
